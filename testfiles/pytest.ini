# pytest configuration file for Bulk Rename Py tests

[pytest]
# Add src to Python path
pythonpath = ../src

# Test discovery
testpaths = testfiles
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Reporting
addopts = -v --tb=short

# Console output
console_output_style = progress

# Disable warnings
filterwarnings = 
    ignore::DeprecationWarning

# Markers (can be used to mark specific tests)
markers = 
    slow: mark tests as slow (deselect with '-m "not slow"')
    integration: mark as integration test
    unit: mark as unit test