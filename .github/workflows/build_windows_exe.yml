name: Build Windows EXE

permissions:
  contents: write

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v4
        with:
          python-version: '3.14'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Sync version from metadata.py into Windows version resource
        shell: pwsh
        run: |
          python scripts/windows_build.py
          git --no-pager diff -- packaging/windows/file_version.txt | Out-Host

      - name: Build Windows EXE (PyInstaller, One-Dir)
        shell: pwsh
        run: pyinstaller packaging/windows/bulk_rename_py.spec --clean

      - name: Create ZIP (One-Dir)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifact | Out-Null

          $distDir = Get-ChildItem dist -Directory | Select-Object -First 1
          if (-not $distDir) {
            Write-Error "No dist directory found"
            exit 1
          }

          $zip = "artifact\BulkRenamePy-${{ github.ref_name }}-win-x64.zip"
          if (Test-Path $zip) { Remove-Item $zip -Force }

          Compress-Archive -Path $distDir.FullName -DestinationPath $zip

      - name: Generate SHA256
        shell: pwsh
        run: |
          $zip = "artifact\BulkRenamePy-${{ github.ref_name }}-win-x64.zip"
          $outfile = "artifact\SHA256SUMS-win-x64.txt"
          Get-FileHash $zip -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLower())  $(Split-Path $_.Path -Leaf)" } |
            Out-File -Encoding ascii $outfile
          Get-ChildItem artifact

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BulkRenamePy-${{ github.ref_name }}-win-x64
          path: |
            artifact/BulkRenamePy-${{ github.ref_name }}-win-x64.zip
            artifact/SHA256SUMS-win-x64.txt

      - name: Attach to GitHub Release (tag only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          overwrite_files: true
          files: |
            artifact/BulkRenamePy-${{ github.ref_name }}-win-x64.zip
            artifact/SHA256SUMS-win-x64.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
